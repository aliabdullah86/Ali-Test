<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Crémé Dorée promo</title>
<style>
  @font-face { font-family: "Great Vibes"; src: url(assets/fonts/great-vibes-latin-400-normal.woff2); }
  @font-face { font-family: "Playfair"; font-weight: 600; src: url(assets/fonts/playfair-display-latin-600-normal.woff2); }
  @font-face { font-family: "Playfair"; font-style: italic; src: url(assets/fonts/playfair-display-latin-400-italic.woff2); }
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2); }
  @font-face { font-family: "Montserrat"; font-weight: 600; src: url(assets/fonts/montserrat-latin-600-normal.woff2); }
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="config.js"></script>
<script>
const W = 1080, H = 1920;
const ctx = document.getElementById("c").getContext("2d");
const C = window.CONFIG;

const GOLD = "#b8894a", GOLD_LIGHT = "#e3c48d", ROSE = "#c9787a", BLUSH = "#f5e4e0", INK = "#5a3b2e";

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

const images = {};
function loadImage(name) {
  return new Promise(res => { const im = new Image(); im.onload = () => { images[name] = im; res(); }; im.src = `assets/${name}.jpg`; });
}

function text(str, x, y, { font, color = INK, align = "center", alpha = 1, spacing = 0, shadow = false }) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  if (spacing) ctx.letterSpacing = spacing + "px";
  if (shadow) { ctx.shadowColor = "rgba(60,30,20,.35)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 4; }
  ctx.fillText(str, x, y);
  ctx.restore();
}

// Text that rises and fades in, then fades out.
function reveal(str, x, y, t, tin, tout, opts) {
  const a = easeOut(prog(t, tin, tin + .7)) * (1 - prog(t, tout - .4, tout));
  if (a <= 0) return;
  ctx.save();
  ctx.translate(0, (1 - easeOut(prog(t, tin, tin + .7))) * 40);
  text(str, x, y, { ...opts, alpha: a });
  ctx.restore();
}

function goldGradient(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#f0d9a8"); g.addColorStop(.5, GOLD); g.addColorStop(1, "#8a6231");
  return g;
}

// Photo with slow Ken Burns zoom/pan.
function photo(name, t, t0, t1, { z0 = 1, z1 = 1.12, x0 = 0, x1 = 0, y0 = 0, y1 = 0 } = {}) {
  const im = images[name];
  const p = easeInOut(prog(t, t0, t1));
  const z = lerp(z0, z1, p);
  const w = W * 1.125 * z, h = H * 1.125 * z;
  ctx.drawImage(im, (W - w) / 2 + lerp(x0, x1, p), (H - h) / 2 + lerp(y0, y1, p), w, h);
  // warm, soft grade
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  ctx.fillStyle = "rgba(255,190,150,.35)";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, "rgba(40,20,10,0)"); v.addColorStop(1, "rgba(40,20,10,.45)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function blushBackground(t) {
  const g = ctx.createLinearGradient(0, 0, W * .4, H);
  g.addColorStop(0, "#fbf1ee"); g.addColorStop(.55, BLUSH); g.addColorStop(1, "#e9cbc6");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * .5, H * .38, 0, W * .5, H * .38, W * .9);
  glow.addColorStop(0, `rgba(255,236,200,${.55 + .1 * Math.sin(t * 1.5)})`); glow.addColorStop(1, "rgba(255,236,200,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}

// ---------- particles ----------
const sparkles = (() => { const r = rng(7); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: 2 + r() * 7, sp: 20 + r() * 50, ph: r() * 6.28, tw: 1 + r() * 3 })); })();
function drawSparkles(t, alpha = 1) {
  ctx.save();
  for (const p of sparkles) {
    const y = (p.y - t * p.sp + H * 10) % H;
    const a = alpha * (.35 + .65 * Math.abs(Math.sin(t * p.tw + p.ph)));
    ctx.globalAlpha = a;
    ctx.fillStyle = GOLD_LIGHT;
    ctx.beginPath();
    const s = p.s;
    const x = p.x + Math.sin(t + p.ph) * 12;
    ctx.moveTo(x, y - s * 2); ctx.quadraticCurveTo(x, y, x + s * 2, y); ctx.quadraticCurveTo(x, y, x, y + s * 2);
    ctx.quadraticCurveTo(x, y, x - s * 2, y); ctx.quadraticCurveTo(x, y, x, y - s * 2);
    ctx.fill();
  }
  ctx.restore();
}

const cinnamon = (() => { const r = rng(11); return Array.from({ length: 160 }, () => ({ x: r() * W, d: r() * 4, s: 1.5 + r() * 3.5, sp: 250 + r() * 300, dr: (r() - .5) * 60 })); })();
function drawCinnamon(t, t0, t1) {
  if (t < t0 || t > t1) return;
  const a = prog(t, t0, t0 + .4) * (1 - prog(t, t1 - .5, t1));
  ctx.save();
  for (const p of cinnamon) {
    const lt = t - t0 - p.d * .3;
    if (lt < 0) continue;
    const y = -20 + lt * p.sp;
    if (y > H) continue;
    ctx.globalAlpha = a * .85;
    ctx.fillStyle = p.s > 3.5 ? "#8b5a2b" : "#a8733f";
    ctx.beginPath(); ctx.arc(p.x + Math.sin(lt * 2 + p.d) * p.dr, y, p.s, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

const petals = (() => { const r = rng(23); return Array.from({ length: 26 }, () => ({ x: r() * W, d: r() * 3, s: 22 + r() * 26, sp: 160 + r() * 160, rot: r() * 6.28, vr: (r() - .5) * 2.5, sw: 40 + r() * 80, c: r() })); })();
function drawPetals(t, t0, t1) {
  if (t < t0 || t > t1) return;
  const a = prog(t, t0, t0 + .5) * (1 - prog(t, t1 - .5, t1));
  for (const p of petals) {
    const lt = t - t0 + p.d;
    const y = -60 + lt * p.sp - p.d * p.sp;
    if (y < -80 || y > H + 80) continue;
    ctx.save();
    ctx.globalAlpha = a * .9;
    ctx.translate(p.x + Math.sin(lt * 1.3 + p.d) * p.sw, y);
    ctx.rotate(p.rot + lt * p.vr);
    ctx.scale(1, .6 + .4 * Math.sin(lt * 3 + p.d));
    const g = ctx.createLinearGradient(-p.s, 0, p.s, 0);
    g.addColorStop(0, p.c > .5 ? "#e8a3a6" : "#f2c2c0"); g.addColorStop(1, p.c > .5 ? "#c9787a" : "#e39a9c");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -p.s); ctx.bezierCurveTo(p.s, -p.s * .6, p.s * .8, p.s * .7, 0, p.s);
    ctx.bezierCurveTo(-p.s * .8, p.s * .7, -p.s, -p.s * .6, 0, -p.s);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- whipped cream ----------
// A piped rosette: soft shaded blob with spiral ridges.
function rosette(x, y, r, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = "rgba(120,80,50,.28)"; ctx.shadowBlur = r * .5; ctx.shadowOffsetY = r * .15;
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(.6, "#fdf8f0"); g.addColorStop(1, "#eadccb");
  ctx.fillStyle = g;
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * 6.283;
    const rr = r * (1 + .07 * Math.sin(a * 8));
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineCap = "round";
  for (let k = 0; k < 8; k++) {
    const a0 = k / 8 * 6.283;
    ctx.strokeStyle = "rgba(200,175,150,.45)"; ctx.lineWidth = r * .07;
    ctx.beginPath(); ctx.arc(r * .12 * Math.cos(a0), r * .12 * Math.sin(a0), r * .72, a0, a0 + 1.4); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = r * .05;
    ctx.beginPath(); ctx.arc(r * .1 * Math.cos(a0) - r * .04, r * .1 * Math.sin(a0) - r * .04, r * .64, a0 + .2, a0 + 1.3); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.beginPath(); ctx.arc(-r * .12, -r * .15, r * .22, 0, 6.28); ctx.fill();
  ctx.restore();
}

// Transition: rows of piped cream rosettes pile up from the bottom until the
// frame is covered, then the whole cream layer sweeps upward off-screen.
const creamDots = (() => {
  const r = rng(99), out = [];
  const R = 120;
  for (let row = 0; row < 11; row++) for (let col = 0; col < 6; col++) {
    out.push({ x: col * 210 + (row % 2) * 105 - 40 + r() * 30, y: H + 40 - row * 205 + r() * 30, r: R + r() * 40, rot: r() * 6.28, d: row / 11 + r() * .05 });
  }
  return out;
})();
function creamTransition(t, t0, dur = 1.3) {
  const p = (t - t0) / dur;
  if (p <= 0 || p >= 1) return;
  const fill = clamp(p / .5), lift = easeInOut(clamp((p - .55) / .45));
  ctx.save();
  ctx.translate(0, -lift * (H + 400));
  if (fill >= 1) { ctx.fillStyle = "#f7efe4"; ctx.fillRect(0, 0, W, H + 400); }
  for (const d of creamDots) {
    const s = easeBack(clamp((fill - d.d * .9) / .12));
    if (s > 0) rosette(d.x, d.y, d.r * s, d.rot + fill);
  }
  ctx.restore();
}

// Piping bag nozzle that pipes a line of rosettes along a path.
function pipingBorder(t, t0, t1, y) {
  const n = 7, p = prog(t, t0, t1);
  for (let i = 0; i < n; i++) {
    const s = easeBack(clamp((p * n - i) / 1.2));
    if (s > 0) rosette(90 + i * 150, y + Math.sin(i * 1.7) * 8, 70 * s, i);
  }
  if (p > 0 && p < 1) {
    const x = 90 + p * n * 150 - 20, by = y - 115 + Math.sin(t * 18) * 4;
    ctx.save();
    ctx.translate(x, by); ctx.rotate(.25); ctx.scale(.6, .6); ctx.translate(0, -85);
    const g = ctx.createLinearGradient(-60, 0, 60, 0);
    g.addColorStop(0, "rgba(240,240,245,.92)"); g.addColorStop(.5, "rgba(255,255,255,.98)"); g.addColorStop(1, "rgba(215,215,225,.92)");
    ctx.fillStyle = g; ctx.strokeStyle = "rgba(160,160,175,.8)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-85, -260); ctx.lineTo(85, -260); ctx.lineTo(16, 30); ctx.lineTo(-16, 30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = goldGradient(30, 90);
    ctx.beginPath(); ctx.moveTo(-22, 30); ctx.lineTo(22, 30); ctx.lineTo(8, 85); ctx.lineTo(-8, 85); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ---------- milk drips ----------
const drips = (() => { const r = rng(5); return Array.from({ length: 8 }, (_, i) => ({ x: 60 + i * 135 + r() * 40, w: 48 + r() * 40, len: 120 + r() * 460, d: r() * .8 })); })();
function milkDrips(t, t0, t1) {
  const a = 1 - prog(t, t1 - .5, t1);
  if (t < t0 || a <= 0) return;
  const band = 90 * easeOut(prog(t, t0, t0 + .5));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(90,60,40,.3)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#fffdf8"); g.addColorStop(.5, "#fbf3e6"); g.addColorStop(1, "#fffaf2");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, band);
  for (let i = drips.length - 1; i >= 0; i--) {
    const d = drips[i];
    const L = band + d.len * easeOut(prog(t, t0 + .3 + d.d, t0 + 2.6 + d.d));
    const hw = d.w / 2;
    ctx.lineTo(d.x + hw + 18, band);
    ctx.quadraticCurveTo(d.x + hw, band, d.x + hw, band + 20);
    ctx.bezierCurveTo(d.x + hw * .55, band + 60, d.x + hw * .5, L - hw * 2.2, d.x + hw * .85, L - hw * 1.1);
    ctx.arc(d.x, L - hw * 1.1, hw * .85, 0, Math.PI);
    ctx.bezierCurveTo(d.x - hw * .5, L - hw * 2.2, d.x - hw * .55, band + 60, d.x - hw, band + 20);
    ctx.quadraticCurveTo(d.x - hw, band, d.x - hw - 18, band);
  }
  ctx.lineTo(0, band); ctx.closePath(); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (const d of drips) {
    const L = band + d.len * easeOut(prog(t, t0 + .3 + d.d, t0 + 2.6 + d.d));
    if (L - band > 60) { ctx.beginPath(); ctx.moveTo(d.x - d.w * .2, band + 20); ctx.lineTo(d.x - d.w * .2, L - d.w * 1.3); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------- logo ----------
function logo(cx, cy, s, t, t0) {
  const p = prog(t, t0, t0 + 1.6);
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  // rose brush arc
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(201,120,122,.75)"; ctx.lineWidth = 26;
  ctx.beginPath(); ctx.arc(0, 0, 250, .15, .15 + 2.3 * easeOut(prog(t, t0 + .3, t0 + 1.5))); ctx.stroke();
  ctx.strokeStyle = "rgba(201,120,122,.4)"; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(0, 0, 272, .3, .3 + 1.9 * easeOut(prog(t, t0 + .5, t0 + 1.6))); ctx.stroke();
  // gold ring
  ctx.strokeStyle = goldGradient(-260, 260); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 262, -Math.PI / 2, -Math.PI / 2 + 6.283 * easeInOut(p)); ctx.stroke();
  // monogram
  const m = easeOut(prog(t, t0 + .4, t0 + 1.4));
  ctx.globalAlpha = m;
  ctx.fillStyle = goldGradient(-200, 60);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 230px Playfair";
  ctx.fillText("C", -38, -95 + (1 - m) * 30);
  ctx.fillText("D", 38, -60 + (1 - m) * 30);
  ctx.restore();
}

function goldRule(cx, y, w, p) {
  ctx.save();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - w / 2 * p, y); ctx.lineTo(cx + w / 2 * p, y); ctx.stroke();
  ctx.fillStyle = GOLD;
  ctx.globalAlpha = p;
  ctx.beginPath(); ctx.moveTo(cx, y - 10); ctx.lineTo(cx + 10, y); ctx.lineTo(cx, y + 10); ctx.lineTo(cx - 10, y); ctx.fill();
  ctx.restore();
}

// Frosted caption card over photos.
function card(y, h, t, tin, tout, draw) {
  const a = easeOut(prog(t, tin, tin + .6)) * (1 - prog(t, tout - .4, tout));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(0, (1 - easeOut(prog(t, tin, tin + .6))) * 60);
  ctx.fillStyle = "rgba(251,241,238,.86)";
  ctx.shadowColor = "rgba(60,30,20,.3)"; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.roundRect(70, y, W - 140, h, 36); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = GOLD_LIGHT; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(86, y + 16, W - 172, h - 32, 28); ctx.stroke();
  draw();
  ctx.restore();
}

// ---------- timeline ----------
const T = { intro: 4.6, s1: 9.6, s2: 14.8, s3: 19.8, end: 26 };
window.DURATION = T.end;

function render(t) {
  ctx.clearRect(0, 0, W, H);

  if (t < T.intro + .65) {                 // 1. Brand intro
    blushBackground(t);
    drawSparkles(t);
    logo(W / 2, 640, 1, t, .2);
    reveal(C.brand.toUpperCase(), W / 2, 1010, t, 1.1, 99, { font: "600 88px Playfair", color: INK, spacing: 8 });
    goldRule(W / 2, 1090, 520, easeOut(prog(t, 1.6, 2.3)));
    reveal(C.byline, W / 2, 1180, t, 1.9, 99, { font: "110px 'Great Vibes'", color: ROSE });
    reveal("presents", W / 2, 1400, t, 2.7, 99, { font: "600 36px Montserrat", color: GOLD, spacing: 14 });
    reveal(C.product, W / 2, 1520, t, 3.0, 99, { font: "150px 'Great Vibes'", color: INK });
  }
  if (t >= T.intro && t < T.s1 + .65) {    // 2. Three milks
    photo("top", t, T.intro, T.s1 + .7, { z0: 1.02, z1: 1.18, y0: 20, y1: -30 });
    milkDrips(t, T.intro + .5, T.s1 + .2);
    card(1430, 330, t, T.intro + 1.2, T.s1 + .2, () => {
      text("Three milks.", W / 2, 1535, { font: "600 84px Playfair", color: INK });
      text("One unforgettable bite.", W / 2, 1645, { font: "italic 58px Playfair", color: ROSE });
    });
  }
  if (t >= T.s1 && t < T.s2 + .65) {       // 3. Whipped cream
    photo("side", t, T.s1, T.s2 + .7, { z0: 1.15, z1: 1.0, x0: -20, x1: 10 });
    drawCinnamon(t, T.s1 + 2.6, T.s2 + .3);
    card(150, 300, t, T.s1 + .8, T.s2 + .2, () => {
      text("Soaked. Whipped.", W / 2, 250, { font: "600 76px Playfair", color: INK });
      text("Perfected.", W / 2, 350, { font: "110px 'Great Vibes'", color: ROSE });
    });
    pipingBorder(t, T.s1 + .9, T.s1 + 3.4, H - 150);
  }
  if (t >= T.s2 && t < T.s3 + .65) {       // 4. Gifting
    photo("gift", t, T.s2, T.s3 + .7, { z0: 1.0, z1: 1.14, y0: -20, y1: 30 });
    drawPetals(t, T.s2 + .3, T.s3 + .5);
    card(1440, 330, t, T.s2 + .9, T.s3 + .2, () => {
      text("Wrapped with love", W / 2, 1545, { font: "600 76px Playfair", color: INK });
      text("perfect for gifting", W / 2, 1655, { font: "96px 'Great Vibes'", color: ROSE });
    });
  }
  if (t >= T.s3) {                         // 5. Call to action
    blushBackground(t);
    drawSparkles(t, .8);
    const e = t - T.s3;
    logo(W / 2, 470, .7, e, .3);
    reveal(C.brand.toUpperCase(), W / 2, 760, e, .9, 99, { font: "600 72px Playfair", color: INK, spacing: 7 });
    reveal(C.byline, W / 2, 850, e, 1.2, 99, { font: "90px 'Great Vibes'", color: ROSE });
    goldRule(W / 2, 950, 440, easeOut(prog(e, 1.4, 2)));
    reveal("Order yours today", W / 2, 1090, e, 1.7, 99, { font: "600 84px Playfair", color: INK });
    C.details.forEach((d, i) => reveal(d, W / 2, 1210 + i * 70, e, 2.1 + i * .2, 99, { font: "500 40px Montserrat", color: INK, spacing: 2 }));
    // pulsing contact pill
    const pa = easeOut(prog(e, 2.9, 3.5));
    if (pa > 0) {
      const pulse = 1 + .03 * Math.sin(e * 5);
      ctx.save();
      ctx.globalAlpha = pa;
      ctx.translate(W / 2, 1440); ctx.scale(pulse * (.8 + .2 * pa), pulse * (.8 + .2 * pa));
      ctx.fillStyle = goldGradient(-70, 70);
      ctx.shadowColor = "rgba(138,98,49,.45)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
      ctx.beginPath(); ctx.roundRect(-400, -70, 800, 140, 70); ctx.fill();
      ctx.restore();
      text(C.contact, W / 2, 1442, { font: "600 50px Montserrat", color: "#fffaf3", alpha: pa, spacing: 2 });
    }
    pipingBorder(t, T.s3 + 3.2, T.s3 + 5.2, H - 90);
  }

  creamTransition(t, T.intro - .65);
  creamTransition(t, T.s1 - .65);
  creamTransition(t, T.s2 - .65);
  creamTransition(t, T.s3 - .65);

  // fade in from / out to cream
  const f = Math.max(1 - prog(t, 0, .5), prog(t, T.end - .6, T.end));
  if (f > 0) { ctx.fillStyle = `rgba(247,239,228,${f})`; ctx.fillRect(0, 0, W, H); }
}

window.render = render;
window.ready = Promise.all([
  ...["top", "side", "gift"].map(loadImage),
  document.fonts.load("150px 'Great Vibes'"), document.fonts.load("600 80px Playfair"),
  document.fonts.load("italic 60px Playfair"), document.fonts.load("500 40px Montserrat"),
  document.fonts.load("600 40px Montserrat"),
]).then(() => { render(0); return true; });

// Preview in a browser: plays in real time, loops.
if (!navigator.webdriver) {
  const start = performance.now();
  window.ready.then(() => (function loop() { render(((performance.now() - start) / 1000) % T.end); requestAnimationFrame(loop); })());
}
</script>
</body>
